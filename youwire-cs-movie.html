<script>
(function(){
const clamp01=x=>x<0?0:x>1?1:x, seg=(t,a,b)=>clamp01((t-a)/(b-a)), lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3), ei=p=>p*p*p, eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eob=(p,s)=>{s=s==null?1.70158:s;const q=p-1;return 1+(s+1)*q*q*q+s*q*q;};
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function css(text){const s=document.createElement('style');s.textContent=text;document.head.appendChild(s);}
class Camera{constructor(el){this.el=el;this.k=[];}set(k){this.k=k;}
 apply(t){const k=this.k;if(!k.length)return;let a=k[0],b=k[0],p=0;
  if(t<=k[0].t){a=b=k[0];}else if(t>=k[k.length-1].t){a=b=k[k.length-1];}
  else{for(let i=0;i<k.length-1;i++){if(t>=k[i].t&&t<=k[i+1].t){a=k[i];b=k[i+1];const e=b.ease||eio;p=e(seg(t,a.t,b.t));break;}}}
  const cx=lerp(a.cx,b.cx,p),cy=lerp(a.cy,b.cy,p),z=lerp(a.z,b.z,p);
  this.el.style.transform='translate('+(960-cx*z).toFixed(2)+'px,'+(540-cy*z).toFixed(2)+'px) scale('+z.toFixed(4)+')';}}
const defs={};
window.kit={seg,lerp,clamp01,eo,ei,eio,eob,h,css,Camera,scene:(id,d)=>{defs[id]=d;}};
window.__film={defs,make(stage,dur,start){return Object.assign({},window.kit,{stage,dur,start});}};
})();
</script>
<script>// One customer's story across the four practices. The desk holds YouWire, the team chat, the CRM and the AI chat (the last three are original designs). Fictional people and data throughout.

<script>
(async function(){
const META=[{"id": "open", "dur": 4}, {"id": "call", "dur": 7}, {"id": "analysis", "dur": 5}, {"id": "digest", "dur": 6}, {"id": "reply", "dur": 5}, {"id": "sync", "dur": 4}, {"id": "record", "dur": 8}, {"id": "newbie", "dur": 4}, {"id": "ask", "dur": 5}, {"id": "answer", "dur": 7}, {"id": "grow", "dur": 6}, {"id": "away", "dur": 4}, {"id": "handask", "dur": 4}, {"id": "doc", "dur": 10}, {"id": "thirty", "dur": 5}, {"id": "end", "dur": 6}], stageEl=document.getElementById('stage'), total=META.reduce((s,m)=>s+m.dur,0);
let acc=0; const S=[];
for(const m of META){const el=document.createElement('div');el.className='scene-box';stageEl.appendChild(el);
 const d=__film.defs[m.id];const inst=Object.create(d);const k=__film.make(el,m.dur,acc);
 S.push({m,el,inst,k,start:acc});acc+=m.dur;}
for(const s of S){s.el.style.display='block';if(s.inst.init)await s.inst.init(s.k);s.el.style.display='none';}
let t=0,playing=true,last=performance.now(),cur=null;
const bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('tm'),btn=document.getElementById('btn');
function draw(){let s=S.find(x=>t>=x.start&&t<x.start+x.m.dur)||S[S.length-1];
 if(cur!==s){if(cur)cur.el.style.display='none';s.el.style.display='block';cur=s;}
 try{s.inst.render(t-s.start,s.k);}catch(e){console.error(e);}
 fill.style.width=(t/total*100)+'%';const f=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');tm.textContent=f(t)+' / '+f(total);btn.textContent=playing?'❚❚':'▶';}
function loop(now){const dt=(now-last)/1000;last=now;if(playing){t+=dt;if(t>=total){t=total-0.001;playing=false;}}draw();requestAnimationFrame(loop);}
function fit(){const w=innerWidth,h=innerHeight-56,sc=Math.min(w/1920,h/1080);stageEl.style.transform='scale('+sc+')';stageEl.style.left=((w-1920*sc)/2)+'px';stageEl.style.top=((h-1080*sc)/2)+'px';}

btn.onclick=()=>{if(t>=total-0.01)t=0;playing=!playing;};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btn.onclick();}if(e.key==='ArrowRight')t=Math.min(total-0.001,t+5);if(e.key==='ArrowLeft')t=Math.max(0,t-5);});
bar.onclick=e=>{const r=bar.getBoundingClientRect();t=Math.max(0,Math.min(total-0.001,(e.clientX-r.left)/r.width*total));};
requestAnimationFrame(loop);
})();
</script>
